<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>스터디 신청 수정</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 40px;
    }
    /* 수정 폼 전체 영역 */
    .container {
      width: 500px;
      margin: 0 auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* 제목 */
    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      text-align: center;
    }

    /* 각 입력 항목 영역 */
    .form-group {
      margin-bottom: 20px;
    }

    /* 입력 항목 이름 */
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    /* 입력창 */
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    /* 검증 오류 메시지 */
    .error {
      margin-top: 5px;
      color: red;
      font-size: 14px;
    }

    /* 버튼 영역 */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    /* 수정 완료 버튼 */
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    /* 링크를 버튼처럼 표시 */
    .button-link {
      flex: 1;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .submit-button {
      background-color: #333;
      color: white;
    }

    .cancel-button {
      background-color: #ddd;
      color: #333;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>스터디 신청 수정하기</h1>
    <form th:action="@{/study{id}/deit(id=${studyId}})" th:object ="${studyForm}" method="post" novalidate>

      <label for="name">신청자 이름</label>
      <input type="text" id="name" th:field="*{name}" th:errorclass="input-error" required>
      <p class="error-message" th:errors="*{name}">신청자 이름 오류</p>
      <label for="topic">관심 주제</label>
      <select id="topic" th:field="*{topic}" th:errorclass="input-error" required>
        <option value="">주제를 선택하세요.</option>
        <option value="Spring Boot">Spring Boot</option>
        <option value="JAVA">JAVA</option>
        <option value="데이터베이스">데이터베이스</option>
      </select>
      <p class="error-message" th:errors="*{topic}">관심주제 오류</p>
      <label for="studyHours">주당 학습시간</label>
      <input type="number" id="studyHours" th:field="*{studyHours}" min="1" th:errorclass="input-error" required>
      <p class="error-message" th:errors="*{studyHours}">주당 학습시간 오류</p>
      <button type="submit">수정하기</button>
    </form>
  </div>

</body>
</html>
