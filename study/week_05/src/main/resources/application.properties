#spring boot 애플리케이션의 이름
spring.application.name=week_05
#주소(h2에 접속할 주소)
spring.datasource.url=jdbc:h2:file:./data/studydb
#h2 DB에서 사용할 사용자 이름
spring.datasource.username=sa
#h2 DB에서 사용할 비밀번호
spring.datasource.password=

#암기 안해도된다
#hibernate 설정
#Study Entity의 구조를 확인하여 필요한 DB 테이블과 열을 생성하고 변경
spring.jpa.hibernate.ddl=update

#구현체를 생성하여 실행할 SQL을 콘솔에 출력
spring.jpa.show-sql=true

#콘솔에 출력하는 SQL을 줄바꿈하여 읽기 쉽게 보여줌
spring.properties.hibernate.format_sql=true

#브라우저에서 h2 db테이블과 데이터를 확인할 수 있도록 설정
spring.h2.console.enabled=true

#h2 Console의 경로를 지정
spring.h2.console.path=/h2-console