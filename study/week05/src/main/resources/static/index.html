<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>BMI 계산기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BMI 계산기</h1>

    <!--
            입력값을 Spring Boot의 /bmi 주소로 전송하세요.
        조건
        - 요청 주소 : /bmi
        - 요청 방식 : GET
        아래 form 태그의 action과 method를 완성하세요.    -->
    <form action="/bmi-result" method="post">

        <label for="name">이름</label>

        <!--   이름을 Query String으로 전송할 수 있도록     name 속성을 작성하세요.
            전달할 데이터 이름 : name     -->
        <input
                type="text"
                id="name"
                name="name"
                placeholder="이름을 입력하세요"
                required
        >
        <label for="height">키(cm)</label>

        <!--          키를 Query String으로 전송할 수 있도록      name 속성을 작성하세요.
            전달할 데이터 이름 : height       -->
        <input
                type="number"
                id="height"
                name="height"
                placeholder="예: 170"
                step="0.1"
                required
        >

        <label for="weight">몸무게(kg)</label>

        <!--    몸무게를 Query String으로 전송할 수 있도록     name 속성을 작성하세요.
            전달할 데이터 이름 : weight      -->
        <input
                type="number"
                id="weight"
                name="weight"
                placeholder="예: 65"
                step="0.1"
                required
        >

        <button type="submit">BMI 계산하기</button>
    </form>
</div>
</body>
</html>
