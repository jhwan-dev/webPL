<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>상품 상세</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    .container {
      width: 450px;
      margin: 60px auto;
      padding: 30px;
      background-color: white;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    .item {
      padding: 14px;
      border-bottom: 1px solid #dddddd;
    }

    .label {
      display: inline-block;
      width: 140px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .buttons a,
    .buttons button {
      flex: 1;
      padding: 11px;
      text-align: center;
      box-sizing: border-box;
      cursor: pointer;
    }

    .delete-form {
      flex: 1;
    }

    .delete-form button {
      width: 100%;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>상품 상세</h1>
  <div class="item"><span class="label">상품번호</span><span th:text="${product.id}"></span></div>
  <div class="item"><span class="label">상품명</span><span th:text="${product.title}"></span></div>
  <div class="item"><span class="label">가격</span><span th:text="|${product.price}원|"></span></div>
  <div class="item"><span class="label">수량</span><span th:text="${product.quantity}"></span></div>
  <div class="item"><span class="label">카테고리</span><span th:text="${product.category}"></span></div>
  <div class="item"><span class="label">판매여부</span>
    <span th:text="${product.onSale ? '판매중' : '판매안함'}"></span></div>

  <div class="buttons">
    <a th:href="@{/products}">목록으로</a>
    <a th:href="@{/products/{id}/edit(id=${product.id})}">수정</a>
    <form class="delete-form" th:action="@{/products/{id}/delete(id=${product.id})}" method="post">
      <button type="submit">삭제</button>
    </form>
  </div>
</div>
</body>
</html>
