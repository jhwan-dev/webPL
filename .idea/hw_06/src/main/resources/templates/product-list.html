<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>상품 목록</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    .container {
      width: 850px;
      margin: 60px auto;
      padding: 30px;
      background-color: white;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #dddddd;
      text-align: center;
    }

    th {
      background-color: #f1f3f5;
    }

    .new-link {
      display: inline-block;
      margin-top: 10px;
    }

    .empty-message {
      padding: 25px;
      text-align: center;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<!--
===========================================================
[실습 1] 전체 화면 영역을 작성합니다.

CSS에 이미 만들어 둔 container 클래스를 사용합니다.

형식:

<div class="container">

    내용

</div>
===========================================================
-->
<div class="container">
  <h1>상품 목록</h1>
  <a class="new-link" th:href="@{/products/new}">새 상품 등록</a>
  <table>
    <thead>
    <tr>
      <th>번호</th>
      <th>상품명</th>
      <th>가격</th>
      <th>수량</th>
      <th>카테고리</th>
      <th>판매여부</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
      <td th:text="${product.id}"></td>
      <td th:text="${product.title}"></td>
      <td th:text="|${product.price}원|"></td>
      <td th:text="|${product.quantity}|"></td>
      <td th:text="${product.category}"></td>
      <td th:text="${product.onSale == true ? '판매중' : '판매안함'}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(products)}">
      <td class="empty-message" colspan="6">등록된 상품이 없습니다.</td>
    </tr>
    </tbody>
  </table>
  <a class="home-link" th:href="@{/}">메인 화면으로</a>
</div>

<!--
===========================================================
[실습 2] 화면 제목을 작성합니다.

사용 태그:
<h1>

화면에 표시할 내용:
상품 목록
===========================================================
-->


<!--
===========================================================
[실습 3] 새 상품 등록 화면으로 이동하는 링크를 작성합니다.

ProductController의 공통 주소:

@RequestMapping("/products")

등록 폼을 보여주는 메서드:

@GetMapping("/new")

따라서 최종 요청 주소는:

GET /products/new

입니다.


Thymeleaf에서 링크 주소를 작성할 때:

th:href="@{주소}"

형식을 사용합니다.

CSS 클래스:
new-link

링크에 표시할 글자:
새 상품 등록
===========================================================
-->


<!--
===========================================================
[실습 4] 상품 목록을 출력할 table을 작성합니다.

기본 구조:

<table>

    <thead>
        표의 제목
    </thead>

    <tbody>
        실제 상품 데이터
    </tbody>

</table>

thead : 표 제목 영역
tbody : 실제 데이터 영역
===========================================================
-->


<!--
===========================================================
[실습 5] 표의 제목을 작성합니다.

이번 Product 객체에는 다음 속성이 있습니다.

id
title
price
quantity
category
onSale


따라서 표는 총 6개의 열로 작성합니다.

1. 번호
2. 상품명
3. 가격
4. 수량
5. 카테고리
6. 판매 여부


표의 한 행:
<tr>

표 제목 셀:
<th>
===========================================================
-->


<!--
===========================================================
[실습 6] Controller에서 전달한 products 목록을 반복합니다.

ProductController에는 다음 코드가 있습니다.

model.addAttribute(
        "products",
        productService.findAll()
);


따라서 HTML에서는 전체 상품 목록을:

${products}

라는 이름으로 사용할 수 있습니다.


products 목록에서 Product 객체를 하나씩 꺼내
product라는 변수로 사용합니다.


Thymeleaf 반복문 형식:

th:each="하나의객체 : ${전체목록}"


Study 예제:

th:each="study : ${studies}"


Product에서는 무엇으로 바뀌어야 하는지 생각해서 작성하세요.
===========================================================
-->


<!--
===========================================================
[실습 7] 상품 번호를 출력합니다.

현재 반복 중인 Product 객체의 이름은:

product

입니다.

Product의 id 속성에 접근하려면:

${product.id}

형태를 사용합니다.


화면 출력에는:

th:text

를 사용합니다.
===========================================================
-->


<!--
===========================================================
[실습 8] 상품명을 출력하면서 상세 화면으로 이동하는
링크도 함께 작성합니다.

단순히 상품명을 출력하는 것이 아니라
상품명을 클릭하면 해당 상품의 상세 화면으로 이동해야 합니다.


상세 조회 주소:

GET /products/{id}


예를 들어 현재 상품의 id가 3이면:

/products/3

이라는 주소가 만들어져야 합니다.


Study에서 사용했던 형식을 참고하세요.

@{/study/{id}(id=${study.id})}


Product에서는 다음 값을 이용해야 합니다.

product.id


그리고 링크에 표시할 글자는:

product.title

입니다.


즉 <a> 태그 안에서:

th:href
th:text

두 가지를 사용합니다.
===========================================================
-->


<!--
===========================================================
[실습 9] 상품 가격을 출력합니다.

Product 속성:

price


가격이 35000이라면 화면에는:

35000원

처럼 표시합니다.


Thymeleaf에서 값과 문자열을 함께 출력할 때:

|${값}문자열|

형태를 사용할 수 있습니다.


Study에서:

|${study.studyHours}시간|

이라고 작성했던 것을 참고하세요.
===========================================================
-->


<!--
===========================================================
[실습 10] 상품 수량을 출력합니다.

Product 속성:

quantity

사용:
th:text
===========================================================
-->


<!--
===========================================================
[실습 11] 상품 카테고리를 출력합니다.

Product 속성:

category

사용:
th:text
===========================================================
-->


<!--
===========================================================
[실습 12] 판매 여부를 출력합니다.

Product 속성:

onSale

onSale 값은 Boolean입니다.

true이면:
판매 중

false이면:
판매 안 함

으로 출력합니다.


Thymeleaf 조건 표현식:

조건 ? 참일때값 : 거짓일때값


형식 예:

${조건 ? 'A' : 'B'}


product.onSale 값을 이용하여 작성하세요.
===========================================================
-->


<!--
===========================================================
[실습 13] 등록된 상품이 하나도 없을 때만
안내 문장을 출력합니다.

출력할 문장:

등록된 상품이 없습니다.


조건을 검사할 때:

th:if


List가 비어 있는지 검사할 때:

#lists.isEmpty(목록)


Study 예제:

th:if="${#lists.isEmpty(studies)}"


Product에서는 studies 대신
어떤 이름을 사용해야 하는지 생각해 보세요.


현재 표는 6개의 열이므로 안내 문장의 td에는:

colspan="6"

을 사용합니다.
===========================================================
-->


<!--
===========================================================
[실습 14] 메인 화면으로 이동하는 링크를 작성합니다.

요청 주소:

/

Thymeleaf 링크:

th:href="@{/}"

CSS 클래스:
home-link

표시할 글자:
메인 화면으로
===========================================================
-->

</body>
</html>
